name: Update CFB Rankings

on:
  push:
    paths:
      - "scripts/**"
      - "app.js"
      - "index.html"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 2,4,6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/build_rankings.py
      - name: Build historical backtest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/backtest_model.py
      - name: Commit updated rankings, logos, and backtest
        run: |
          git config user.name "AP Poll Sucks Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rankings.json data/team_logos.json data/backtest.json
          git diff --cached --quiet || git commit -m "Update rankings and historical backtest"
          git push
